# Конфиг ниши. Движок один — ниша задаётся этим файлом.
# Чтобы подключить новый бизнес, скопируйте файл и поменяйте поля.

id: land_agency_demo
name: "Demo Land Agency"
site: https://example.com
offer: |
  Демонстрационная ниша: земельное агентство полного цикла (вымышленная компания).
  - подбор участка под задачу клиента;
  - аудит участка перед покупкой: ЗОУИТ, ПЗЗ, ГПЗУ, обременения, письменное заключение;
  - полный цикл «под ключ»: от подбора участка и участия в торгах до регистрации права;
  - государственные программы: Дальневосточный и Арктический гектар;
  - подготовка схемы расположения участка (СРЗУ), сопровождение земельных торгов;
  - договоры аренды и выкупа, консультации по земельному праву;
  - разрешение на строительство, бизнес-проекты на гектаре.
  Виды участков: ИЖС, ЛПХ, сельхоз, коммерция, туризм.

icp: |
  Лид — человек или ЛПР, у которого ПРЯМО СЕЙЧАС есть земельная задача из списка услуг выше.
  Оценивай строго: если задача не решается ни одной из услуг компании — это НЕ лид.

  ДА, это лид (указывай сегмент):
  1. «гектар» — хочет получить Дальневосточный/Арктический гектар, выбирает территорию, получил отказ,
     не знает как осваивать, подходит срок декларации, оформляет в собственность.
  2. «аудит перед покупкой» — собирается купить или арендовать участок и сомневается: ЗОУИТ, охранные зоны,
     ПЗЗ, ГПЗУ, обременения, «можно ли здесь строить», проверка документов продавца.
  3. «оформление» — смена ВРИ или категории земли, перераспределение и прирезка, СРЗУ, межевание,
     границы и кадастровый учёт, приватизация, узаконивание дома или участка, отказ администрации.
  4. «торги» — участие в аукционе на землю, поиск лотов, сопровождение заявки, задаток, первый опыт торгов.
  5. «подбор участка» — ищет или покупает участок с конкретными критериями (район, площадь, ИЖС/ЛПХ/коммерция).
  6. «разрешение на строительство» — ГПЗУ, СПОЗУ, уведомление о начале строительства, отказ администрации.
  7. «инвестор/бизнес» — инвестор или застройщик подбирает участок под проект, глэмпинг, туризм, коммерцию.
  8. «закупка» — организация (администрация, учреждение, компания) объявила закупку на кадастровые,
     землеустроительные, межевые работы, схему расположения или оценку земли. Это B2B-лид: компания
     может подать заявку как исполнитель. Контакты заказчика есть в извещении.

  НЕТ, это не лид (score ≤ 0.2):
  - стройка, ремонт, инженерия и быт: фундамент, кровля, отопление, септик, скважина, электрика, генератор,
    забор, баня, теплица, сад, огород, урожай, техника, материалы, цены на работы;
  - управление СНТ: собрания, председатель, взносы, общее имущество, споры с правлением;
  - налоги, ипотека, субсидии, маткапитал сами по себе, без земельной задачи из списка выше;
  - бытовые конфликты с соседями без задачи оформления (шум, деревья, животные);
  - человек продаёт участок или предлагает услуги: риелторы, агентства, юристы, кадастровые инженеры,
    курсы, вебинары, блогеры и каналы про инвестиции в землю;
  - новости, законы, обзоры рынка, SEO-статьи и инструкции «как купить/оформить» без личного вопроса;
  - рассказ о прошлом опыте («купил», «оформил», «построил»), если новой задачи нет;
  - закупка НЕ по нашему предмету: вывоз ТКО и мусора, благоустройство, строительство и ремонт дорог,
    озеленение, охрана. Упоминание кадастрового номера участка в описании объекта НЕ делает закупку
    кадастровой — смотри на предмет: что именно поручают исполнителю;
  - запрос старше срока свежести.

  Граничные случаи: спор о границах участка — ДА (межевание). «Как провести свет на участок» — НЕТ.
  «Купил участок, теперь строю дом» — НЕТ, если нет вопроса по оформлению или разрешению.

search:
  region: ru-ru
  # d / w / m / y — насколько свежую выдачу просим у поисковика
  timelimit: m
  # Отбрасывать кандидатов, если в сниппете найдена дата старше N дней
  max_age_days: 90
  results_per_query: 6

# Поисковые запросы по площадкам (seed). В VK уходят без операторов site:.
queries:
  hectare:
    - дальневосточный гектар подскажите как оформить
    - арктический гектар как выбрать участок
    - получил гектар что построить чтобы не забрали
    - гектар отказали в предоставлении что делать
    - не успеваю освоить гектар декларация
  audit:
    - как проверить участок перед покупкой зоуит
    - участок в охранной зоне можно ли строить
    - проверить участок по пзз гпзу перед сделкой
    - продавец торопит с участком как проверить документы
  formalize:
    - изменить вид разрешенного использования участка отказ
    - перераспределение земельного участка прирезка помогите
    - нужна схема расположения земельного участка на кпт
    - узаконить дом на участке помогите оформить
  auctions:
    - первый раз участвую в торгах по земле подскажите
    - аукцион аренда земельного участка как подать заявку
    - выкуп арендованного участка у администрации
  search_plot:
    - ищу участок ижс подскажите на что смотреть
    - куплю участок под ижс помогите с выбором
    - ищу участок под глэмпинг туризм
  forums:
    - site:forumhouse.ru участок зоуит можно ли строить
    - site:forumhouse.ru смена ври участка отказ
    - site:forumhouse.ru дальневосточный гектар
  qa:
    - site:pravoved.ru земельный участок зоуит
    - site:pravoved.ru перераспределение земельного участка
    - site:pravoved.ru изменение вида разрешенного использования

# RSS — самый стабильный бесплатный источник: разделы форума строго по земле и документам
feeds:
  - https://www.forumhouse.ru/forums/482/index.rss   # Земельные вопросы (приватизация, границы)
  - https://www.forumhouse.ru/forums/937/index.rss   # ВРИ, категория земли и их изменение
  - https://www.forumhouse.ru/forums/271/index.rss   # Кадастровый учёт объектов недвижимости
  - https://www.forumhouse.ru/forums/939/index.rss   # Документация на строительство, ГПЗУ, СПОЗУ

# Наблюдатель за страницами: сайты вопросов без RSS
watch_pages:
  - https://pravoved.ru/questions/                    # все новые вопросы
  - https://pravoved.ru/themes/земельное-право/       # раздел «Земельное право»

# Государственные системы: без ключей, с контактами заказчика
tenders:
  regions: []          # коды регионов, например [50, 77]; пусто — вся Россия
  # Лоты torgi — это КАТАЛОГ участков (материал для услуги «мониторинг торгов»), а не заявки клиентов,
  # поэтому источник по умолчанию выключен. Включите, если хотите получать лоты как ленту.
  torgi: []
  zakupki:             # организации заказывают работы — B2B-лиды
    - кадастровые работы
    - межевание земельных участков
    - подготовка схемы расположения земельного участка
    - землеустроительные работы

# Telegram-чаты (нужен разовый вход аккаунтом): впишите чаты, где состоите
chats: []
chat_keywords:
  - участок
  - земл
  - гектар
  - межевани
  - ври
  - кадастр

# Хосты, которые для этой ниши никогда не бывают лидами (плюс общий список в filters.py)
blocked_hosts:
  - domclick.ru
  - cian.ru
  - n1.ru
  - realty.yandex.ru
  - mirkvartir.ru
  - etagi.com

# Дополнительные сигналы спроса для regex-префильтра (Python regex, регистр не важен)
demand_patterns:
  - 'оформить гектар'
  - 'проверк[аи] (участка|зоуит)'
  - 'измен(ить|ение) (ври|категори)'
  - 'участвовать в торгах'
  - 'схем[ау] расположения'
  - 'не успева(ю|ем) освоить'
  - 'перераспределени'
  - 'узаконить'
  - 'можно ли строить'
  - 'отказ(ал[аи])? администраци'

# Жёсткий стоп-фильтр тем: такие кандидаты не доходят до модели (экономит время и деньги)
exclude_patterns:
  - 'генератор|котёл|котел|отоплени|радиатор|тёплый пол|теплый пол|дымоход|камин'
  - 'септик|скважин|водоснабжени|канализаци|насос|фильтр для воды'
  - 'фундамент|кровл|стропил|утеплени|штукатур|сайдинг|плитк|ламинат|обои'
  - 'проводк|розетк|электрощит|узо |освещени'
  - 'теплиц|рассад|урожай|огород|грядк|гортенз|яблон|газон|полив|компост|удобрени'
  - 'мангал|барбекю|бассейн|качел|беседк|вольер|курятник|пчел'
  - 'трактор|мотоблок|снегоуборщ|бензопил'
  - 'флудилк|оффтоп|поздравля|с днем рождения|с днём рождения'
  - 'взнос(ы|ов) снт|председател|общее собрание|правлени[ея] снт|ревизионн'

# Эталонные примеры для модели (few-shot). Сюда же попадают оценки 👍/👎 из интерфейса.
examples:
  - text: "Подскажите, получили дальневосточный гектар в Приморье, срок освоения кончается, не понимаем что строить"
    is_fit: true
    why: "актуальная задача освоения гектара"
  - text: "Хотим купить участок 12 соток, продавец говорит ИЖС, а на карте охранная зона. Как проверить?"
    is_fit: true
    why: "аудит участка перед покупкой"
  - text: "Администрация отказала в изменении ВРИ с ЛПХ на ИЖС, что делать дальше?"
    is_fit: true
    why: "оформление, спор с администрацией"
  - text: "Какой генератор выбрать для дачи на 5 кВт?"
    is_fit: false
    why: "бытовая стройка, не земельная услуга"
  - text: "Как правильно обрезать гортензию осенью?"
    is_fit: false
    why: "садоводство"
  - text: "Председатель СНТ требует взносы за прошлый год, законно ли это?"
    is_fit: false
    why: "управление СНТ, не наша услуга"
  - text: "Делюсь опытом: в прошлом году купил участок на торгах, всё прошло отлично"
    is_fit: false
    why: "прошлый опыт, задачи нет"
  - text: "Как приобрести земельный участок: пошаговая инструкция 2026"
    is_fit: false
    why: "SEO-статья, не человек"
  - text: "Канал про инвестиции в землю: разбираем стратегии покупки участков"
    is_fit: false
    why: "блогер/конкурент, не клиент"
  - text: "Предмет закупки: Выполнение работ по ликвидации мест несанкционированного размещения твердых коммунальных отходов (кадастровый номер земельного участка 55:09:020602:154). Заказчик: администрация района"
    is_fit: false
    why: "предмет — вывоз мусора, кадастровый номер лишь адрес участка"
  - text: "Предмет закупки: Кадастровые работы по межеванию земельных участков с целью постановки на кадастровый учет. Заказчик: комитет по управлению муниципальным имуществом"
    is_fit: true
    why: "организация ищет исполнителя на межевание — наш профиль"
